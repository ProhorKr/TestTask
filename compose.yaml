services:
  app:
    build:
      context: .
      target: app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      LOG_CHANNEL: stderr
    volumes:
      - notes_data:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 5
  tests:
    profiles: ["test"]
    build:
      context: .
      target: tests
    environment:
      APP_ENV: testing
    command: ["php", "artisan", "test"]
volumes:
  notes_data:
